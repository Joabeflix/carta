<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantinho Marcela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Cantinho das cartinhas</h1>
    </header>

    <!-- Lista de Cartas -->
    <section id="hub-view">
      <ul id="cartas-list" class="cartas-grid"></ul>
    </section>

    <!-- Visualizador da Carta -->
    <section id="carta-view" class="hidden">
      <button id="voltar-btn">&larr; Voltar</button>
      <article class="carta-conteudo">
        <h2 id="carta-titulo"></h2>
        <span id="carta-data" class="data"></span>
        <hr>
        <pre id="carta-texto"></pre>
      </article>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
